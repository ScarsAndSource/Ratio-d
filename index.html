<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plumbline</title>
    <meta name="description" content="An instrument, not a mirror. Camera-based face and body measurement, read only against your own baseline." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#12161C" />

    <!--
      og:image / twitter:image below are root-relative, which works for
      local preview but most link-preview crawlers (Facebook, LinkedIn, X,
      Slack) require an absolute URL to reliably fetch the image. Once a
      production domain exists, change these two to
      "https://YOUR-DOMAIN/og-image.png" - see the deploy checklist in
      README.md.
    -->
    <meta property="og:title" content="Plumbline" />
    <meta property="og:description" content="An instrument, not a mirror. Camera-based face and body measurement, read only against your own baseline." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumbline" />
    <meta name="twitter:description" content="An instrument, not a mirror. Camera-based face and body measurement, read only against your own baseline." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
